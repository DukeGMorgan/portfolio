# Netlify deploy configuration.
#
# The deployable website is the `site/` folder — the repo root also holds the
# résumé generator and project docs, which must NOT be served. Setting this in
# the repo (rather than only in the Netlify dashboard) means the setting is
# versioned and survives the project being recreated or reconnected.

[build]
  publish = "site"
  # No build step: plain HTML/CSS/JS, no framework, nothing to compile.
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
